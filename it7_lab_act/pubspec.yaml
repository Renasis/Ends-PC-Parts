name: it7_lab_act
description: "PC Parts Store — Flutter mobile app for hardware shopping with admin dashboard"
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  firebase_database: ^11.3.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3

  # In-app "update available" prompt
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1

  # Map pin (OpenStreetMap tiles, no API key needed)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Animation & Carousel Packages
  lottie: ^3.3.1
  carousel_slider: ^5.0.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  firebase_auth_mocks: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/